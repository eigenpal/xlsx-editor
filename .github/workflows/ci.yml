name: CI

# Source checks and unit tests run concurrently. Same shape as
# docx-editor/.github/workflows/ci.yml, sized for the packages this repository has: each source
# check is its own job, and the unit tests run in shards that recorded durations balance
# (pptx-editor/.github/workflows/ci.yml). The `build`, `fidelity`, `e2e`, and `changeset`
# checks, the Playwright browser cache, and the `package-size` job follow
# pptx-editor/.github/workflows/ci.yml at 194c9fea. The engine tests of the hostile workbooks
# run in the unit shards; the browser hang test keeps only the cases that need a browser.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    strategy:
      # A failed check does not cancel the others: `build` saves the caches and the size report,
      # and each browser check reports its own result.
      fail-fast: false
      matrix:
        # One job for each kind of check, so they run side by side. `lint` is oxlint and the
        # format; `typecheck` is `bun check` for each package and the lane boundaries; `policy`
        # is the repository rules; `xsd` is the schema validation of saved parts. `build` also
        # installs the packed packages into a fresh app, so the packages build once. `fidelity`
        # is the fidelity harness and `e2e` the demo smoke check, both in Chromium. `changeset`
        # and `fidelity` need the history of the base branch.
        check: [lint, typecheck, policy, xsd, build, fidelity, e2e, changeset]
    name: ${{ matrix.check }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # `0` is falsy in expressions, so `x && 0 || 1` is always 1: test the other case.
          fetch-depth: ${{ matrix.check != 'changeset' && matrix.check != 'fidelity' && 1 || 0 }}
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      # The consumer check installs the packed packages from npm. A restored cache answers
      # without the network. Saved only by pushes to main.
      - name: Restore npm cache
        if: matrix.check == 'build'
        uses: actions/cache/restore@v6
        with:
          path: ~/.npm
          key: npm-build-${{ hashFiles('bun.lock') }}
          restore-keys: npm-build-
      # Playwright's browser download, keyed by the lockfile that pins its version. The system
      # dependencies still install with `--with-deps`. Saved only by pushes to main.
      - name: Restore Playwright browsers
        if: matrix.check == 'build' || matrix.check == 'fidelity' || matrix.check == 'e2e'
        id: playwright-cache
        uses: actions/cache/restore@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ hashFiles('bun.lock') }}
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Lint
        if: matrix.check == 'lint'
        run: bun run lint
      - name: Format check
        if: matrix.check == 'lint'
        run: bun run format:check
      - name: Repository rules
        if: matrix.check == 'policy'
        run: |
          bun run check:security
          bun run check:css-scope
          bun run check:terminology
          bun run check:license-headers
          bun run check:docs
          bun run check:tsconfig-lib-floor
          bun run i18n:validate
      # React and Vue adapters against scripts/parity/parity.contract.json (DOCX Editor's
      # parity lane). It reads the committed API snapshots; the build job keeps them current.
      - name: Adapter parity
        if: matrix.check == 'policy'
        run: bun run check:parity
      # Advisories against the dependency closure a consumer installs (docx-editor's shipped-advisories lane).
      - name: Shipped dependency advisories
        if: matrix.check == 'policy'
        run: bun run check:shipped-advisories
      - name: Fixtures match their build
        if: matrix.check == 'xsd'
        run: bun run fixtures:check
      - name: Schema validation of saved parts
        if: matrix.check == 'xsd'
        run: |
          command -v xmllint || (sudo apt-get update && sudo apt-get install -y libxml2-utils)
          bun run validate:xsd
      - name: Typecheck
        if: matrix.check == 'typecheck'
        run: bun run typecheck
      - name: CLA logic tests
        if: matrix.check == 'typecheck'
        run: bash .github/cla/cla.test.sh
      - name: Build packages and check API snapshots
        if: matrix.check == 'build'
        run: |
          bun run build:packages
          bun run api:check
          bun run check:consumer-types
          bun run notices:generate
          bun run check:package-artifacts
          bun run check:shipped-shaper
          bun run check:package-size --out package-sizes.json
      - name: Upload package size report
        if: matrix.check == 'build'
        uses: actions/upload-artifact@v7
        with:
          name: package-sizes
          path: package-sizes.json
          overwrite: true
      - name: Install Chromium
        if: matrix.check == 'build'
        run: bunx playwright install --with-deps chromium
      # Install the packed tarballs into a fresh app. Build it with Vite, webpack 5, and Bun. Show
      # the Vite build and the Vite dev server in Chromium. Build the marked README samples and
      # check each grid in Chromium. Import each entry under Node.js and run the server samples.
      # Uses the packages that the build step above made.
      - name: Consumer install
        if: matrix.check == 'build'
        run: bun run check:consumer-install
      # The fidelity harness (design D8): paints each fixture with the editor's paint in Chromium,
      # scores the pixels of a screenshot and the text lines of a printed PDF of the painted
      # page, and compares both with its reference PDF. It needs a browser and Poppler, so it
      # runs here and not in the pre-commit hook. CI has no reference fonts: it runs with the
      # substitutes.
      - name: Install Chromium and Poppler
        if: matrix.check == 'fidelity'
        run: |
          bunx playwright install --with-deps chromium
          sudo apt-get install -y poppler-utils
          # The known gaps are kept for each Poppler version, and CI needs the list of exactly its
          # tools: log the installed package, so that a runner image update is visible.
          dpkg-query -W poppler-utils
      - name: Fidelity against reference PDFs
        if: matrix.check == 'fidelity'
        run: bun run fidelity
      # A new Poppler, pdf.js, or Chromium version has no known-gap list, and the gate fails.
      # Record the list of this runner's tools, so that a pull request can commit it from the
      # `fidelity-thresholds` artifact after a review of its diff. `--update-gaps` writes nothing
      # when a score is worse.
      - name: Record the known gaps of these tools
        if: failure() && matrix.check == 'fidelity'
        run: bun run fidelity --update-gaps
      - name: Upload the recorded known gaps
        if: failure() && matrix.check == 'fidelity'
        uses: actions/upload-artifact@v7
        with:
          name: fidelity-thresholds
          path: scripts/fidelity/thresholds.ts
      # Thresholds and known gaps only tighten (scripts/fidelity/check-known-gaps.ts). Compare
      # with the merge base of the pull request head and its base branch, not the base branch tip:
      # the checkout is the test merge commit, whose merge base with the base branch is its tip.
      # `fetch-depth: 0` makes both histories available.
      - name: Known gaps only tighten
        if: matrix.check == 'fidelity' && github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: bun run fidelity:check-gaps --base "$(git merge-base "$HEAD_SHA" "origin/$BASE_REF")"
      - name: Upload fidelity report
        if: always() && matrix.check == 'fidelity'
        uses: actions/upload-artifact@v7
        with:
          name: fidelity-report
          path: fidelity-report/
      # The demo smoke check (scripts/verify-demo.ts) in Chromium: the sample opens and paints, a
      # typed value saves and opens again, and the steps that need a browser engine (the system
      # clipboard, layout, computed styles, focus that the engine moves, and a real download).
      # The flows of the demo run as happy-dom tests in the unit shards. It is a check of its
      # own, as in PPTX Editor, and the matrix does not fail fast, so a fidelity failure does not
      # cancel it. Firefox and WebKit stay available locally with `--browser`, outside this gate.
      - name: Install the browser
        if: matrix.check == 'e2e'
        run: bunx playwright install --with-deps chromium
      - name: Demo smoke check
        if: matrix.check == 'e2e'
        run: bun run test:e2e
      # The happy path of the chat example (scripts/verify-chat.ts): the editor in a panel beside
      # a chat, at half the window, a phone-wide window, and the keys between the two.
      - name: Chat example check
        if: matrix.check == 'e2e'
        run: bun run test:e2e:chat
      - name: Upload demo screenshots
        if: failure() && matrix.check == 'e2e'
        uses: actions/upload-artifact@v7
        with:
          name: demo-screenshots
          path: screenshots/
          if-no-files-found: ignore
      # A public API change must carry a changeset (docx-editor's api-changeset lane).
      - name: API change has a changeset
        if: matrix.check == 'changeset' && github.event_name == 'pull_request' && !startsWith(github.head_ref, 'changeset-release/')
        env:
          BASE_REF: ${{ github.base_ref }}
        run: node scripts/check-api-changeset.mjs --base "origin/$BASE_REF"
      - name: Save npm cache
        if: github.event_name == 'push' && matrix.check == 'build'
        uses: actions/cache/save@v6
        with:
          path: ~/.npm
          key: npm-build-${{ hashFiles('bun.lock') }}
      - name: Save Playwright browsers
        if: github.event_name == 'push' && matrix.check == 'build' && steps.playwright-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ hashFiles('bun.lock') }}

  # The lowest versions that the package READMEs state (scripts/lib/consumer-floors.mjs).
  # DOCX Editor and PPTX Editor have no such job: it runs because these READMEs state floors.
  floors:
    name: floors (${{ matrix.floor }})
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        floor: [tools, 20.16.0, 22.3.0]
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Build packages
        run: bun run build:packages
      - name: Install Chromium
        if: matrix.floor == 'tools'
        run: bunx playwright install --with-deps chromium
      - name: TypeScript and Vite floors
        if: matrix.floor == 'tools'
        run: node scripts/check-consumer-floors.mjs
      # The packages build on the current Node.js, and the floor runs what a server consumer runs.
      - name: Setup the Node.js floor
        if: matrix.floor != 'tools'
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.floor }}
      - name: Node.js floor
        if: matrix.floor != 'tools'
        run: node scripts/check-consumer-floors.mjs --node

  # The tarball size against the PR base commit (docx-editor's package-size job). Growth over
  # +20% and +25 KB fails unless the PR has the `size-increase-expected` label.
  package-size:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    needs: checks
    permissions:
      contents: read
      actions: read # download the baseline artifact from a main run
      pull-requests: write # sticky size comment
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Download current size report
        uses: actions/download-artifact@v8
        with:
          name: package-sizes
      - name: Download size report for the PR base commit
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_BRANCH: ${{ github.event.pull_request.base.ref }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: node scripts/package-size-baseline.mjs
      # The label is read from the API, not the frozen event payload, so "label + re-run" works.
      - name: Compare against baseline (gate)
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          allow=""
          if gh api "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/labels" --jq '.[].name' \
            | grep -qx 'size-increase-expected'; then
            allow=1
          fi
          PACKAGE_SIZE_ALLOW_GROWTH="$allow" node scripts/check-package-size.mjs \
            --compare package-sizes.json \
            --baseline baseline/package-sizes.json --comment size-comment.md
      - name: Post sticky PR comment
        if: always() && github.event.pull_request.head.repo.full_name == github.repository
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          comment_id=$(gh api "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments" --paginate \
            --jq '[.[] | select(.user.login == "github-actions[bot]") | select(.body | startswith("<!-- package-size-report -->"))][0].id // empty')
          if [ -n "$comment_id" ]; then
            gh api -X PATCH "repos/${GITHUB_REPOSITORY}/issues/comments/${comment_id}" -F body=@size-comment.md
          else
            gh api "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments" -F body=@size-comment.md
          fi

  # Every unit shard must split the suite with the same durations, or shards overlap and skip
  # files. This job reads the newest durations cache once and hands that one copy to all
  # shards. On a miss every shard splits by file count, which is the same split everywhere.
  # The key names the runner, so durations measured on other machines never balance these
  # shards. Same as pptx-editor/.github/workflows/ci.yml.
  unit-plan:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      planned: ${{ steps.restore.outputs.cache-matched-key != '' }}
    steps:
      - name: Restore test durations
        id: restore
        uses: actions/cache/restore@v6
        with:
          path: test-durations.json
          key: test-durations-ubuntu-2404-${{ github.run_id }}
          restore-keys: test-durations-ubuntu-2404-
      - name: Hand the durations to the shards
        if: steps.restore.outputs.cache-matched-key != ''
        uses: actions/upload-artifact@v7
        with:
          name: test-durations-plan
          path: test-durations.json
          if-no-files-found: error
          retention-days: 3

  # `scripts/test/run-parallel.mjs` runs one `bun test` per file over a worker pool, slowest
  # first. Only the adapter and demo tests preload happy-dom; the engine tests run with no
  # global DOM.
  unit:
    needs: unit-plan
    strategy:
      fail-fast: true
      matrix:
        shard: ['1/3', '2/3', '3/3']
    name: unit (${{ matrix.shard }})
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - name: Install dependencies
        run: bun install --frozen-lockfile
      # The tests of the corpus schema task run xmllint, as the schema validation step does.
      - name: Install xmllint
        run: command -v xmllint || (sudo apt-get update && sudo apt-get install -y libxml2-utils)
      # Required when planned: a shard that lost the file would split differently.
      - name: Download test durations
        if: needs.unit-plan.outputs.planned == 'true'
        uses: actions/download-artifact@v8
        with:
          name: test-durations-plan
          path: node_modules/.cache/xlsx-editor
      # --balance splits by measured time. Without a durations file every shard falls back to
      # the same split by file count, so the shards still partition the suite. --retry-failed
      # runs a failed file once more: a pass on the retry is reported as a FLAKY warning.
      - name: Unit test shard
        env:
          TEST_SHARD: '${{ matrix.shard }}'
        run: >-
          bun run test --shard "$TEST_SHARD" --fail-fast --retry-failed --balance --durations-out shard-durations.json
      - name: Upload shard durations
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v7
        with:
          name: test-durations-shard-${{ strategy.job-index }}
          path: shard-durations.json
          retention-days: 3

  # Pushes to main only. Merges the fresh durations of the shards into one cache entry, drops
  # the entries of deleted test files, and deletes every cache entry that the new one replaces.
  cache-maintenance:
    if: "!cancelled() && github.event_name == 'push'"
    needs: [checks, unit]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: write # delete replaced cache entries
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Download the plan and shard durations
        if: needs.unit.result == 'success'
        uses: actions/download-artifact@v8
        with:
          pattern: test-durations-*
          path: durations
      - name: Merge durations
        if: needs.unit.result == 'success'
        run: |
          set --
          [ -f durations/test-durations-plan/test-durations.json ] &&
            set -- durations/test-durations-plan/test-durations.json
          for shard in durations/test-durations-shard-*/shard-durations.json; do
            [ -f "$shard" ] && set -- "$@" "$shard"
          done
          node scripts/test/merge-durations.mjs --out test-durations.json "$@"
      - name: Save test durations
        if: needs.unit.result == 'success'
        uses: actions/cache/save@v6
        with:
          path: test-durations.json
          key: test-durations-ubuntu-2404-${{ github.run_id }}
      - name: Prune replaced cache entries
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          # Keep the newest entry for each prefix; delete the rest.
          for prefix in test-durations-ubuntu-2404- npm-build- playwright-; do
            gh cache list --ref refs/heads/main --key "$prefix" --sort created_at \
              --order desc --limit 100 --json id --jq '.[1:][].id' |
              while read -r id; do
                gh cache delete "$id"
              done
          done

  # No hostile or large workbook hangs the page (scripts/hang/run.ts). It runs only the cases of
  # scripts/hang/browser-cases.ts that need a real browser: network faults, font loading, races
  # in the demo, and the large workbooks whose browser memory and main-thread blocks it measures.
  # The unit shards run every other hostile workbook through the engine (scripts/hang/
  # engine-run.ts). Each case runs in its own browser under a memory and time watchdog. It is
  # still the longest job, so pull requests skip it and each push to main runs it. PPTX Editor
  # and DOCX Editor run their hang checks outside pull request CI too. Run
  # `bun run test:hang:browser` on a change to the open, the parse limits, or the save.
  hang:
    if: github.event_name == 'push'
    name: hang
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      # The browser download that the `build` check saves on each push to main.
      - name: Restore Playwright browsers
        uses: actions/cache/restore@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ hashFiles('bun.lock') }}
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Install Chromium
        run: bunx playwright install --with-deps chromium
      - name: Browser hang test
        run: bun run test:hang:browser
      - name: Upload hang report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: hang-report
          path: test-results/hang/
          if-no-files-found: ignore
